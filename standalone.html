<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人名片生成器</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-1: #e0e7ff;
      --bg-2: #f3e8ff;
      --bg-3: #dbeafe;
      --primary: #7c3aed;
      --btn-blue: #3b82f6;
      --btn-green: #34d399;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --text-weak: #9ca3af;
      --link: #3b82f6;
    }

    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    /* 背景装饰光斑 */
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 380px; height: 380px;
      background: #c4b5fd;
      top: -80px; left: -80px;
    }
    body::after {
      width: 420px; height: 420px;
      background: #93c5fd;
      bottom: -100px; right: -100px;
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .layout {
      width: 100%;
      max-width: 1040px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }

    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 10px 40px rgba(79, 70, 229, 0.10);
      border-radius: 22px;
    }

    /* ===== 名片预览区 ===== */
    .card-preview {
      padding: 40px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .theme-dots {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .theme-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.8);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      transition: transform 0.18s ease;
    }
    .theme-dot:hover { transform: scale(1.15); }
    .theme-dot.active { transform: scale(1.3); outline: 2px solid var(--primary); outline-offset: 1px; }

    .avatar-wrap {
      width: 120px; height: 120px;
      border-radius: 50%;
      padding: 4px;
      margin-bottom: 18px;
      transition: background 0.4s ease;
    }
    .avatar {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #f3f4f6;
    }
    .avatar-fallback {
      width: 100%; height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #a78bfa, #818cf8);
    }

    .name {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }
    .title {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-sub);
    }
    .company {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-weak);
    }

    .divider {
      width: 40px; height: 3px;
      border-radius: 2px;
      margin: 14px 0;
      transition: background 0.4s ease;
    }

    .bio {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-sub);
      text-align: center;
      max-width: 86%;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      overflow: hidden;
    }
    .bio.collapsed { max-height: 0; opacity: 0; margin: 0; }
    .bio.expanded { max-height: 200px; opacity: 1; }

    .toggle-bio {
      margin-top: 10px;
      font-size: 13px;
      color: var(--link);
      background: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .toggle-bio:hover { opacity: 0.7; text-decoration: underline; }

    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
    .btn:active { transform: translateY(0); }
    .btn-blue { background: var(--btn-blue); }
    .btn-green { background: var(--btn-green); color: #064e3b; }

    /* 名片主题样式 */
    .theme-violet .avatar-wrap { background: linear-gradient(135deg, #c4b5fd, #a78bfa); }
    .theme-violet .divider { background: linear-gradient(90deg, #a78bfa, #c4b5fd); }

    .theme-twilight .avatar-wrap { background: linear-gradient(135deg, #60a5fa, #6366f1); }
    .theme-twilight .divider { background: linear-gradient(90deg, #60a5fa, #6366f1); }

    .theme-mint .avatar-wrap { background: linear-gradient(135deg, #6ee7b7, #34d399); }
    .theme-mint .divider { background: linear-gradient(90deg, #6ee7b7, #34d399); }

    .theme-sunset .avatar-wrap { background: linear-gradient(135deg, #fbbf24, #fb7185); }
    .theme-sunset .divider { background: linear-gradient(90deg, #fbbf24, #fb7185); }

    /* ===== 编辑表单区 ===== */
    .card-form { padding: 36px 32px; }

    .form-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .field { margin-bottom: 20px; }
    .field:last-child { margin-bottom: 0; }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .input, .textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .input:focus, .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }
    .textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

    .hint {
      font-size: 12px;
      color: var(--text-weak);
      margin-top: 4px;
    }

    /* 空状态 */
    .empty-name { color: var(--text-weak); font-style: italic; }

    /* 进入动画 */
    .fade-enter-active, .fade-leave-active { transition: opacity 0.25s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
  </style>
</head>
<body>
  <div id="app" class="app">
    <div class="layout">
      <!-- 左侧：名片预览 -->
      <section class="glass card-preview" :class="'theme-' + theme.id">
        <!-- 主题切换圆点 -->
        <div class="theme-dots" role="tablist" aria-label="名片主题">
          <button
            v-for="t in themes"
            :key="t.id"
            class="theme-dot"
            :class="{ active: theme.id === t.id }"
            :style="{ background: t.dot }"
            :title="t.name"
            @click="theme = t"
            role="tab"
            :aria-selected="theme.id === t.id"
          ></button>
        </div>

        <!-- 头像 -->
        <div class="avatar-wrap">
          <img
            v-if="avatarOk"
            class="avatar"
            :src="form.avatar"
            @error="avatarOk = false"
            alt="头像"
          />
          <div v-else class="avatar-fallback">{{ initials }}</div>
        </div>

        <!-- 姓名 -->
        <h2 class="name">
          <span v-if="form.name">{{ form.name }}</span>
          <span v-else class="empty-name">未填写姓名</span>
        </h2>
        <p v-if="form.title" class="title">{{ form.title }}</p>
        <p v-if="form.company" class="company">{{ form.company }}</p>

        <div class="divider"></div>

        <!-- 简介（可收起） -->
        <transition name="fade">
          <p v-show="bioExpanded && form.bio" class="bio expanded">{{ form.bio }}</p>
        </transition>
        <button
          v-if="form.bio"
          class="toggle-bio"
          @click="bioExpanded = !bioExpanded"
        >
          {{ bioExpanded ? '收起简介' : '展开简介' }}
        </button>

        <!-- 操作按钮 -->
        <div class="actions">
          <button class="btn btn-blue" @click="nextTheme">切换名片</button>
          <button class="btn btn-green" @click="reset">重置名片</button>
        </div>
      </section>

      <!-- 右侧：编辑表单 -->
      <section class="glass card-form">
        <h3 class="form-title">编辑名片 <span>✨</span></h3>

        <div class="field">
          <label class="label" for="f-name">姓名</label>
          <input id="f-name" v-model.trim="form.name" class="input" placeholder="请输入姓名" />
        </div>

        <div class="field">
          <label class="label" for="f-title">职位</label>
          <input id="f-title" v-model.trim="form.title" class="input" placeholder="请输入职位" />
        </div>

        <div class="field">
          <label class="label" for="f-company">公司</label>
          <input id="f-company" v-model.trim="form.company" class="input" placeholder="请输入公司" />
        </div>

        <div class="field">
          <label class="label" for="f-bio">个人简介</label>
          <textarea id="f-bio" v-model.trim="form.bio" class="textarea" placeholder="一句话介绍自己"></textarea>
        </div>

        <div class="field">
          <label class="label" for="f-avatar">头像链接</label>
          <input id="f-avatar" v-model.trim="form.avatar" class="input" placeholder="https://..." @change="onAvatarChange" />
          <div class="hint">支持任意在线图片地址，加载失败时显示首字母占位</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, computed, watch } = Vue;

    createApp({
      setup() {
        const defaultForm = () => ({
          name: '张小明',
          title: '高级前端开发工程师',
          company: '字节跳动科技有限公司',
          bio: '热爱技术，专注于 Vue.js 生态建设与前端工程化实践，喜欢把复杂的问题拆解成优雅的代码。',
          avatar: 'https://picsum.photos/200/200?random=1'
        });

        const form = reactive(defaultForm());
        const avatarOk = ref(true);
        const bioExpanded = ref(true);

        const themes = [
          { id: 'violet',   name: '紫罗兰', dot: 'linear-gradient(135deg,#c4b5fd,#a78bfa)' },
          { id: 'twilight', name: '暮光蓝', dot: 'linear-gradient(135deg,#60a5fa,#6366f1)' },
          { id: 'mint',     name: '晨曦绿', dot: 'linear-gradient(135deg,#6ee7b7,#34d399)' },
          { id: 'sunset',   name: '夕阳橙', dot: 'linear-gradient(135deg,#fbbf24,#fb7185)' }
        ];
        const theme = ref(themes[0]);

        const initials = computed(() => {
          const n = (form.name || '?').trim();
          return n ? n.charAt(0).toUpperCase() : '?';
        });

        function onAvatarChange() {
          avatarOk.value = true;
        }

        function nextTheme() {
          const idx = themes.findIndex(t => t.id === theme.value.id);
          theme.value = themes[(idx + 1) % themes.length];
        }

        function reset() {
          Object.assign(form, defaultForm());
          avatarOk.value = true;
          bioExpanded.value = true;
          theme.value = themes[0];
        }

        // 头像地址变化时重新尝试加载
        watch(() => form.avatar, () => { avatarOk.value = true; });

        return {
          form, avatarOk, bioExpanded, themes, theme,
          initials, onAvatarChange, nextTheme, reset
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
